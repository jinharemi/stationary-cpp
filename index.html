<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Logistik Gudang Modern</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div id="loginBox">
        <h2>Sistem Logistik</h2>
        <div class="subtitle">Masuk untuk mengambil barang</div>
        <form id="formLogin">
            <div class="form-group">
                <label>Alamat Email</label>
                <input type="email" id="loginEmail" placeholder="nama@perusahaan.com" required>
            </div>
            <div class="form-group">
                <label>Kata Sandi</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit">Masuk Sistem</button>
        </form>
        <div class="switch-link" onclick="tukarHalaman('registerBox', 'loginBox')">Belum terdaftar? Buat akun di sini</div>
    </div>

    <div id="registerBox" class="hidden">
        <h2>Pendaftaran Akun</h2>
        <div class="subtitle">Daftarkan diri Anda sebagai pengambil resmi</div>
        <form id="formRegister">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="regNama" placeholder="Nama lengkap Anda" required>
            </div>
            <div class="form-group">
                <label>Alamat Email</label>
                <input type="email" id="regEmail" placeholder="nama@perusahaan.com" required>
            </div>
            <div class="form-group">
                <label>Kata Sandi</label>
                <input type="password" id="regPassword" placeholder="Minimal 6 karakter" required>
            </div>
            <button type="submit" style="background: var(--success); color: #0f172a;">Daftar Akun</button>
        </form>
        <div class="switch-link" onclick="tukarHalaman('loginBox', 'registerBox')">Sudah punya akun? Login kembali</div>
    </div>

    <div id="gudangBox" class="hidden">
        <h2>Pengambilan Gudang</h2>
        <div class="subtitle">Isi rincian barang yang akan dikeluarkan</div>
        
        <div class="welcome-msg">
            Sesi Aktif: <span id="namaUserAktif" style="color: var(--primary); font-weight: 600;">-</span>
        </div>

        <form id="formGudang">
            <div class="form-group">
                <label>Pilih Departemen</label>
                <select id="dept" required>
                    <option value="">-- Pilih Departemen --</option>
                    <option value="IT (Teknologi Informasi)">IT (Teknologi Informasi)</option>
                    <option value="HRD & GA">HRD & GA</option>
                    <option value="Produksi / Manufaktur">Produksi / Manufaktur</option>
                    <option value="Gudang & Logistik">Gudang & Logistik</option>
                    <option value="Keuangan / Finance">Keuangan / Finance</option>
                    <option value="Pemasaran / Marketing">Pemasaran / Marketing</option>
                </select>
            </div>
            
            <label>Daftar Item Barang</label>
            <div id="containerBarang">
                </div>
            
            <button type="button" class="btn-secondary" onclick="tambahBarisBarang()">➕ Tambah Item Barang</button>
            <br><br><br>
            <button type="submit" style="background: var(--success); color: #0f172a;">Konfirmasi & Ambil Barang</button>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
